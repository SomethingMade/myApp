<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haba Support</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --bg:#FAF9F5; --panel:#FFFFFF; --soft:#F3F1EA; --line:#E7E4DA; --ink:#1F1E1D; --muted:#6F6B63; --faint:#9B968B;
  --brand:#111111; --brand-ink:#FFFFFF; --accent:#D97757;
  --open:#C2410C; --open-bg:#FDEEE6; --pending:#92600A; --pending-bg:#FBF1D9; --resolved:#166534; --resolved-bg:#E4F4E8;
  --urgent:#B91C1C; --urgent-bg:#FCE8E8; --note-bg:#FFF7DB; --note-line:#EBD98F;
  --bubble-in:#F1EEE6; --bubble-out:#111111; --bubble-out-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(31,30,29,.05),0 8px 24px rgba(31,30,29,.06);
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#191816; --panel:#22211E; --soft:#2A2926; --line:#34322D; --ink:#F2F0EA; --muted:#A7A298; --faint:#7E7A70;
    --brand:#F2F0EA; --brand-ink:#191816;
    --open-bg:#3A2418; --pending-bg:#3A2F14; --resolved-bg:#16301E; --urgent-bg:#3D1B1B; --note-bg:#33300F; --note-line:#5C5420;
    --bubble-in:#2E2D29; --bubble-out:#F2F0EA; --bubble-out-ink:#191816;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ---------- auth screens ---------- */
.auth-wrap{height:100%;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.auth-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:32px 28px;box-shadow:var(--shadow)}
.logo{width:44px;height:44px;border-radius:12px;background:#111;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.logo svg{width:26px;height:26px;fill:#fff;stroke:none}
.auth-card h1{font-size:28px;margin-bottom:4px}
.auth-card p.sub{color:var(--muted);margin:0 0 22px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.input,.select,.textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus,.textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(127,127,127,.15)}
.textarea{resize:vertical;min-height:80px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:600;transition:background .12s,transform .06s}
.btn:hover{background:var(--soft)} .btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{opacity:.9;background:var(--brand)}
.btn.danger{color:var(--urgent)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--urgent);font-size:13px;min-height:18px;margin:4px 0 8px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:13px}
.uidbox{display:flex;gap:8px;align-items:center;background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;word-break:break-all;margin:10px 0 16px}

/* ---------- app shell ---------- */
#app{height:100%;display:grid;grid-template-columns:236px minmax(0,1fr)}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .logo{margin:0;width:34px;height:34px;border-radius:9px}
.brand .logo svg{width:20px;height:20px}
.brand b{font-family:var(--serif);font-size:19px;font-weight:600}
.brand small{display:block;color:var(--muted);font-size:11.5px;margin-top:-2px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;overflow:auto}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600}
.nav a:hover{background:var(--soft);color:var(--ink)}
.nav a.active{background:var(--soft);color:var(--ink)}
.nav .badge{margin-left:auto;background:var(--accent);color:#fff;border-radius:999px;font-size:11.5px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center}
.me{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--line);margin-top:8px}
.me .who{min-width:0;flex:1}
.me .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.me .who span{color:var(--muted);font-size:12px;text-transform:capitalize}
.icon-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;border:0;background:transparent;color:var(--muted)}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.main{min-width:0;min-height:0;display:flex;flex-direction:column}
.page{display:none;flex:1;min-height:0;overflow:auto;padding:28px 32px 40px}
.page.active{display:block}
.page.flex.active{display:flex;padding:0;overflow:hidden}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h2{font-size:30px}
.page-head p{margin:2px 0 0;color:var(--muted)}

/* avatars / chips */
.av{width:36px;height:36px;border-radius:50%;background:var(--soft) center/cover no-repeat;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--muted);flex-shrink:0;border:1px solid var(--line)}
.av.lg{width:64px;height:64px;font-size:22px}
.av.sm{width:28px;height:28px;font-size:11px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.open{background:var(--open-bg);color:var(--open)} .chip.pending{background:var(--pending-bg);color:var(--pending)} .chip.resolved{background:var(--resolved-bg);color:var(--resolved)}
.chip.urgent,.chip.high{background:var(--urgent-bg);color:var(--urgent)} .chip.normal,.chip.low,.chip.cat{background:var(--soft);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}

/* cards / stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.stat span{color:var(--muted);font-size:12.5px;font-weight:600}
.stat b{display:block;font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.1;margin-top:6px}
.stat small{color:var(--faint)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 18px 8px;margin-bottom:18px}
.card h3{font-size:18px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px}
.row:first-of-type{border-top:0}
.row:hover{background:var(--soft)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);text-align:center;padding:36px 12px}
.bars{display:flex;align-items:flex-end;gap:12px;height:140px;}

/* ---------- OVERRIDE LAYOUT RULE CONFIGURATIONS ---------- */
#app, #app h1, #app h2, #app h3, #app b, #app span, #app a, #app button, #app div, #app p {
  font-style: italic !important;
}
#app .btn, #app button, #app .primary {
  border-radius: 9999px !important;
}
#app .stats {
  display: flex !important;
  flex-direction: column !important;
  gap: 10px !important;
  width: 100% !important;
}
#app .stat {
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  padding: 14px 20px !important;
  border-radius: 8px !important;
  background: var(--panel) !important;
  border: 1px solid var(--line) !important;
}
#app .stat b {
  margin-top: 0 !important;
  font-size: 22px !important;
}
#app .nav {
  display: grid !important;
  grid-template-columns: repeat(2, 1fr) !important;
  gap: 8px !important;
  align-content: start !important;
}
#app .nav a {
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  justify-content: center !important;
  text-align: center !important;
  padding: 16px 8px !important;
  font-size: 12px !important;
  border-radius: 12px !important;
  background: transparent;
  border: 1px solid transparent;
}
#app .nav a:hover, #app .nav a.active {
  background: var(--soft) !important;
  border-color: var(--line) !important;
}
#app .nav a svg {
  margin-bottom: 6px !important;
}
#app .nav .badge {
  margin-left: 0 !important;
  margin-top: 4px !important;
  position: relative !important;
}
</style>
</head>
<body>

  <!-- The app container contains your exact structural elements so logic views bind naturally -->
  <div id="app">
    <div class="rail">
      <div class="brand">
        <div class="logo">
